services:
  evidence:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
